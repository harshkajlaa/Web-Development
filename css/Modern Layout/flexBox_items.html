<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flex Box Properties</title>
    <style>
        *{margin:0px;padding:0px;}
        .box{
            height:75px;
            width:75px;
            border: 3px solid black;
            margin:5px;
        }
        #heading{text-align:center;}
        #container{
            height:300px;
            width:600px;
            padding:10px;
            margin:20px;
            border:3px solid black;
            background-color: rgb(203, 203, 228);
            display:flex;
            flex-direction: row;
            justify-content:center;
            /* flex-wrap:wrap; */
            align-items: start;
            flex-grow: 1;
            /* align-content: center; */
        }
        #box1 {background-color:aqua;
        order:2;}
        #box2 {background-color:blueviolet;
        flex-grow: 1; order:4;}
        /* #box2 {background-color:blueviolet;
        flex-shrink:2;} */
        /* #box2 {align-self:flex-end; background-color:blueviolet} */
        #box3 {background-color:yellow; order:1;}
        #box4 {background-color:tomato; order:3;}

    </style>
</head>
<body>
    <h1><center>Flex box properties and flex items properties</center></h1><br><hr><br>
    <h1 id="heading">Flex Container</h1>
    <div id="container">
        <div id="box1" class="box">Flex Item 1</div>
        <div id="box2" class="box">Flex Item 2</div>
        <div id="box3" class="box">Flex Item 3</div>
        <div id="box4" class="box">Flex Item 4</div>
        <!-- <div id="box4" class="box">Flex Item 5</div>
        <div id="box4" class="box">Flex Item 6</div>
        <div id="box4" class="box">Flex Item 7</div> -->
    </div>
</body>
</html>
