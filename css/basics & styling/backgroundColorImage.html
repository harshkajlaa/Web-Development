<!DOCTYPE html>
<html lang="en">
<head>
    <title>Background Color</title>

    <style>
        .box{
            height: 50px;
            width: 50px;
        }
        #box1 {
            background-color: aqua;
            visibility: visible;
        }
        #box2 {
            background-color: green;
        }
        * {
            margin:0 ;
            padding:0
        }
        .Back_learn{
            height: 500px;
            width: 500px;
            Background-image: url(/images/myntra_logo.jpg);
            Background-size: contain;
            background-repeat: no-repeat;
            color: rgba(254, 28, 28, 0.8) ; background-color: aqua
     }
    </style>
</head>
<body>
    <div id="box1" class="box">box1</div>
    <div id="box2" class="box">box2</div>
    <div class="Back_learn">Background Color</div>
    <div style="color: rgb(249, 24, 24,0.1)">First</div>
    <div style="color: rgb(249, 24, 24,0.25)">First</div>
    <div style="color: rgb(249, 24, 24,0.5)">First</div>
    <div style="color: rgb(249, 24, 24,0.75)">First</div>
    <div style="color: rgb(249, 24, 24,1.0)">First</div>
</body>
</html>
