<!DOCTYPE html>
<html lang="en">
<head>
    <title>Media Queries</title>
    <style>
        .box{
            padding:5px;
            height:100px;
            width:400px;
            background-color: aqua;
        }
        @media screen and (min-width: 300px) {
            .box{
                background-color:rgb(232, 122, 122);
            }
        }
    </style>
</head>
<body>
    <div class="box">Box</div>
</body>
</html>
