<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Type Checkbox  </title>
</head>
<body>
    <form action="/contact-me">
        <table>
        <tr><td><label for="C"> C </label>
        <input type="checkbox" name="Languages" id="C" value="C"><br></td></tr>
        <tr></tr><td><label for="C++"> C++ </label>
        <input type="checkbox" name="Languages" id="C++" Value="C++"><br></td></tr>
        <tr></tr><td><label for="Java"> Java </label>
        <input type="checkbox" name="Languages" id="Java" Value="Java"><br></td></tr>
        </table>
    </form>
</body>
</html>
