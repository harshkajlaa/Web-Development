<!DOCTYPE html>
<html lang="en">
<head>
  <title>Practice set 6</title>

<body>
  <script>

    function checkNum(num){
      if (num%2===0){
        return `${num} is even`;
      } else if (num%2!=0) {
        return `${num} is odd`;
      }
    }
    console.log(checkNum(0));
    console.log(checkNum(3));
    console.log(checkNum(4));
    console.log(checkNum(5));
    console.log(checkNum(6));


    function largeNum(num1,num2){
      if (num1>num2){
        return `${num1} is larger`
      } else if (num2>num1){
        return `${num2} is larger`
      }
    }
    console.log(largeNum(0,5));
    console.log(largeNum(14,5));
    console.log(largeNum(41,55));
    console.log(largeNum(24,15));
    console.log(largeNum(4,105));


    function temp(temp1){
      let f= ((9/5)*temp1)+32;
      console.log(`temperature in fahrenheit is ${f}`)
    }

    temp(32);
    temp(54);
    temp(76);
    temp(111);

  </script>

</body>
</html>
