<!DOCTYPE html>
<html lang="en">
<head>
  <title>Myntra Bag</title>
  <style>
    .Bag_button{
      background-color: rgb(194, 234, 194);
      border: none;
      padding: 5px 15px 5px 15px;
      border-radius: 15px;
      text-transform: capitalize;

  }
    .Wish_button{
      padding: 5px 35px;
      border: 2px solid black;
      border-radius: 5px;
      text-transform: uppercase;
  }
  </style>
</head>
<body>
  <button class="Bag_button" onclick="cartQuantity+=1;
  document.querySelector('#cart-summary').innerText=`Your Bag Has ${cartQuantity} Items`;">add to Bag</button>

  <button class="Wish_button" onclick="cartQuantity-=1;
  document.querySelector('#cart-summary').innerText=`Your Bag Has ${cartQuantity} Items`;"> Move to  wishlist</button>

  <button class="Bag_button" onclick="cartQuantity+=2;
  document.querySelector('#cart-summary').innerText=`Your Bag Has ${cartQuantity} Items`;">add 1+1 Sale Item</button>

  <h1 id="cart-summary"></h1>

  <script>
    let cartQuantity = 0;
    document.querySelector('#cart-summary').innerText=`Your Bag Has ${cartQuantity} Items`;
  </script>
</body>
</html>
